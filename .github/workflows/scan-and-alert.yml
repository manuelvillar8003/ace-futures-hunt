name: ACE Futures Hunt - Scan and Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_GRADE: "B"
        run: node scripts/scan-and-alert.js > run-log.txt 2>&1 || echo "SCRIPT_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Commit run log (always, for debugging)
        run: |
          git config user.name "ACE Futures Hunt Bot"
          git config user.email "actions@github.com"
          git add run-log.txt alert-state.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update run log + dedupe state [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push still failed nach rebase, ignoriere fuer diesen Lauf"
          else
            echo "nichts zu committen"
          fi

      - name: Fail if script failed
        if: env.SCRIPT_FAILED == 'true'
        run: exit 1
